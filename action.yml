name: "StructuraLens"
description: "Analyze C# solutions and report maintainability diffs on pull requests"
author: "Dark Peak Development"
branding:
  icon: "bar-chart-2"
  color: "blue"

inputs:
  solution:
    description: "Path to solution (.sln/.slnx) or project (.csproj)"
    required: true
  working-directory:
    description: "Working directory for analysis"
    required: false
    default: "."
  github-token:
    description: "GitHub token used for release downloads and PR comments"
    required: false
  run-diff:
    description: "Run base vs head diff on pull_request events"
    required: false
    default: "true"
  report-html:
    description: "Generate HTML report"
    required: false
    default: "true"
  report-json:
    description: "Generate JSON report"
    required: false
    default: "true"
  post-comment:
    description: "Post a PR comment with actionable changes only (dependencies and added diagnostics)"
    required: false
    default: "true"
  max-projects:
    description: "Max number of projects to include in comment table"
    required: false
    default: "10"
  fail-on:
    description: "Fail the action check if diagnostics are added: none (default), error (fail on new errors), warning (fail on new errors or warnings)"
    required: false
    default: "none"
  version:
    description: "StructuraLens release version (e.g., 1.2.0). Use 'latest' to auto-detect."
    required: false
    default: "latest"
  analysis-mode:
    description: "Analysis mode: Full or DiagnosticsAndReferences"
    required: false
    default: "Full"

outputs:
  base-report-json:
    description: "Path to base JSON report"
  head-report-json:
    description: "Path to head JSON report"
  diff-report-json:
    description: "Path to diff JSON report"
  diff-report-html:
    description: "Path to diff HTML report"

runs:
  using: "node20"
  main: "dist/index.js"
