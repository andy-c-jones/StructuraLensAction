name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3 or v1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Normalize and validate version
        id: version
        shell: bash
        run: |
          raw="${{ inputs.version }}"
          version="${raw#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: '$raw'. Use semantic versioning like 1.2.3 or v1.2.3."
            exit 1
          fi

          tag="v$version"
          major_tag="v${version%%.*}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "major_tag=$major_tag" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag does not already exist
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag '$tag' already exists locally."
            exit 1
          fi

          if git ls-remote --tags --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag '$tag' already exists on origin."
            exit 1
          fi

      - name: Create and push tags
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          major_tag="${{ steps.version.outputs.major_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$tag" -m "Release $tag"
          git tag -fa "$major_tag" -m "Release $tag"

          git push origin "refs/tags/$tag"
          git push origin "refs/tags/$major_tag" --force

      - name: Create GitHub Release with autogenerated notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          args=("$tag" --title "$tag" --generate-notes)

          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
